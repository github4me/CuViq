<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuViq lazy-loading example</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .spacer { height: 180vh; display: grid; place-items: start center; padding-top: 2rem; }
      cuviq-viewer { width: min(80vw, 520px); margin: 0 auto 4rem; }
    </style>
    <script type="module" src="/dist/browser/cuviq.js"></script>
  </head>
  <body>
    <div class="spacer">Scroll to load the model</div>
    <cuviq-viewer
      src="/tests/fixtures/cube.glb"
      poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e8edf0'/%3E%3C/svg%3E"
      alt="Blue metallic cube product model"
    ></cuviq-viewer>
  </body>
</html>
