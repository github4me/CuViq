<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuViq npm package preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #edf1f3;
        color: #263238;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main { width: min(92vw, 680px); }
      h1 { margin: 0; font-size: 1rem; letter-spacing: 0.025em; }
      p { margin: 5px 0 14px; color: #607078; font-size: 0.8rem; }

      cuviq-viewer {
        width: 100%;
        box-shadow: 0 22px 70px rgb(38 50 56 / 12%);
      }
    </style>
    <!-- The published npm package, served by unpkg. -->
    <script type="module" src="https://unpkg.com/cuviq-viewer@0.1.0/dist/browser/cuviq.js"></script>
  </head>
  <body>
    <main>
      <h1>CuViq npm package preview</h1>
      <p>Loading <code>cuviq-viewer@0.1.0</code> from npm via unpkg.</p>
      <cuviq-viewer
        src="/examples/models/brass-ferrule-block.glb"
        alt="Brass ferrule block, 10.8 millimetres"
        loading="eager"
      ></cuviq-viewer>
    </main>
  </body>
</html>
