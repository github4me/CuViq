<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuViq React integration preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #151719;
        color: #f2eee7;
      }

      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; }
      button, code { font: inherit; }

      .bench {
        width: min(1100px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 275px;
        gap: 32px;
        align-items: center;
        padding: 40px 0;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #c99852;
        font: 700 0.7rem/1.2 ui-monospace, "Cascadia Code", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 3.1rem); letter-spacing: -0.055em; }
      .lede { max-width: 46ch; margin: 14px 0 28px; color: #a8afb0; line-height: 1.55; }

      .viewer-frame {
        position: relative;
        overflow: hidden;
        border: 1px solid #404443;
        border-radius: 24px;
        background: radial-gradient(circle at 50% 38%, #303534, #1b1e1e 67%);
        box-shadow: 0 32px 90px rgb(0 0 0 / 32%);
      }

      .viewer-frame::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 13px;
        right: 15px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c99852;
        box-shadow: 0 0 0 5px rgb(201 152 82 / 12%);
        pointer-events: none;
      }

      cuviq-viewer { width: 100%; }

      .panel {
        border-left: 1px solid #353938;
        padding: 6px 0 6px 24px;
      }

      .panel h2 { margin: 0 0 18px; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .rule { height: 1px; margin: 18px 0; background: #353938; }
      .label { margin: 0 0 5px; color: #858d8d; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .value { margin: 0; color: #e4ded4; font-size: 0.87rem; line-height: 1.45; overflow-wrap: anywhere; }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #f2eee7;
        font-size: 0.9rem;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d6aa64;
        box-shadow: 0 0 0 4px rgb(214 170 100 / 12%);
      }

      .status[data-kind="ready"]::before { background: #74bda3; box-shadow: 0 0 0 4px rgb(116 189 163 / 12%); }
      .status[data-kind="error"]::before { background: #e07d68; box-shadow: 0 0 0 4px rgb(224 125 104 / 12%); }

      button {
        width: 100%;
        margin-top: 24px;
        border: 1px solid #c99852;
        border-radius: 9px;
        padding: 10px 12px;
        background: transparent;
        color: #edcf9d;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover { background: #c99852; color: #191b1b; }
      button:focus-visible { outline: 3px solid #f2eee7; outline-offset: 3px; }

      @media (max-width: 760px) {
        .bench { grid-template-columns: 1fr; gap: 22px; padding: 28px 0; }
        .panel { border-top: 1px solid #353938; border-left: 0; padding: 22px 0 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/preview-react.tsx"></script>
  </body>
</html>
