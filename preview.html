<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuViq model preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #edf1f3;
        color: #263238;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main { width: min(92vw, 680px); }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.025em;
      }

      p {
        margin: 5px 0 0;
        color: #607078;
        font-size: 0.8rem;
      }

      label {
        flex: none;
        padding: 9px 14px;
        border: 1px solid #c7d0d5;
        border-radius: 999px;
        background: #fff;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }

      label:hover { border-color: #315efb; }
      label:focus-within { outline: 3px solid rgb(49 94 251 / 25%); }
      input { position: absolute; width: 1px; height: 1px; opacity: 0; }

      cuviq-viewer {
        width: 100%;
        box-shadow: 0 22px 70px rgb(38 50 56 / 12%);
      }

      #message {
        min-height: 1.2rem;
        margin-top: 10px;
        font-size: 0.76rem;
        color: #607078;
      }

      @media (max-width: 520px) {
        header { align-items: start; flex-direction: column; }
      }
    </style>
    <script type="module" src="/dist/browser/cuviq.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CuViq model preview</h1>
          <p>Drag to rotate · wheel or pinch to zoom</p>
        </div>
        <label>
          Choose a local GLB
          <input id="file" type="file" accept=".glb,model/gltf-binary" />
        </label>
      </header>

      <cuviq-viewer
        id="viewer"
        src="/examples/models/brass-ferrule-block.glb"
        alt="Brass ferrule block, 10.8 millimetres"
        loading="eager"
      ></cuviq-viewer>
      <div id="message" role="status" aria-live="polite">Showing the included brass ferrule sample</div>
    </main>

    <script type="module" src="/preview.js"></script>
  </body>
</html>
